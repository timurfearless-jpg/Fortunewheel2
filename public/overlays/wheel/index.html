<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Timur Fearless IRL Fortune Wheel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="overlay-root" aria-live="polite">
      <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

      <section class="hud-layout">
        <section class="wheel-stage">
          <div class="wheel-rig" id="wheelRig">
            <canvas id="wheelCanvas" class="wheel-canvas" aria-label="IRL fortune wheel"></canvas>
            <div class="wheel-pointer" aria-hidden="true">
              <svg viewBox="0 0 88 98" role="img">
                <path d="M44 94 8 12 44 28 80 12Z" />
                <path d="M44 75 24 28 44 38 64 28Z" />
              </svg>
            </div>
            <div class="wheel-hub" aria-hidden="true">
              <span>GO</span>
            </div>
            <div class="scan-ring" aria-hidden="true"></div>
          </div>
        </section>

        <aside class="status-panel">
          <section class="challenge-card" id="resultPanel">
            <span id="resultSignal">CURRENT CHALLENGE</span>
            <div class="challenge-row">
              <img id="resultIcon" alt="" />
              <div>
                <h2 id="resultLabel">TOUCH GRASS</h2>
                <p id="resultDetail">Find some green and touch it.</p>
              </div>
            </div>
          </section>
        </aside>
      </section>
    </main>
    <script src="./overlay.js"></script>
  </body>
</html>
